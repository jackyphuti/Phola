name: Build iOS App

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build target'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - unsigned_ipa
          - simulator
  push:
    branches:
      - main
    paths:
      - 'ios/**'
      - 'capacitor.config.ts'
      - '.github/workflows/build-ios.yml'

jobs:
  build-ios:
    name: Build iOS (Capacitor)
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install Node dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Install CocoaPods
        run: |
          cd ios/App
          pod install --repo-update
          cd ../..

      - name: Build for iOS Simulator
        if: ${{ github.event_name == 'push' || github.event.inputs.build_type == 'simulator' || github.event.inputs.build_type == 'both' }}
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/derivedData \
            clean build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

          cd build/derivedData/Build/Products/Release-iphonesimulator
          zip -r ../../../../Phola-iOS-Simulator.zip App.app
          cd ../../../..

      - name: Build Unsigned IPA for Device / Sideloading
        if: ${{ github.event_name == 'push' || github.event.inputs.build_type == 'unsigned_ipa' || github.event.inputs.build_type == 'both' }}
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            clean archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

          mkdir -p build/Payload
          cp -r build/App.xcarchive/Products/Applications/App.app build/Payload/
          cd build
          zip -r ../Phola-iOS-unsigned.ipa Payload/
          cd ..

      - name: Upload iOS Simulator Build Artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: Phola-iOS-Simulator
          path: Phola-iOS-Simulator.zip
          if-no-files-found: ignore

      - name: Upload Unsigned IPA Artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: Phola-iOS-Unsigned-IPA
          path: Phola-iOS-unsigned.ipa
          if-no-files-found: ignore
