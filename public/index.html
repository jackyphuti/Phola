<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Phola</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0b1329;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
    }
    .logo-container {
      width: 96px;
      height: 96px;
      border-radius: 24px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.4);
    }
    .logo-container img {
      width: 64px;
      height: 64px;
      object-fit: contain;
    }
    h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }
    p {
      font-size: 15px;
      color: #94a3b8;
      max-width: 320px;
      line-height: 1.5;
      margin-bottom: 28px;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="logo-container">
    <img src="phola_app_icon-192x192.png" alt="Phola" onerror="this.style.display='none'">
  </div>
  <h1>Phola</h1>
  <p>Connecting to secure services...</p>
  <div class="spinner"></div>

  <script>
    // Redirect to live web service if running inside WebView without server.url configured
    const targetUrl = "https://phola-beta.vercel.app";
    setTimeout(() => {
      if (window.location.hostname === 'localhost' || window.location.protocol === 'capacitor:') {
        window.location.replace(targetUrl);
      }
    }, 600);
  </script>
</body>
</html>
